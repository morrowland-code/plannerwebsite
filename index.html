<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Planner Website</title>
  <style>
    body {
      margin: 0;
      font-family: "Comic Sans MS", Arial, sans-serif;
      background: #fff0f7;
      color: #5b2641;
    }

    header {
      background: #ff69b4;
      color: white;
      padding: 18px 25px;
      font-size: 28px;
      font-weight: bold;
    }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr 380px;
      gap: 15px;
      padding: 15px;
    }

    .box {
      background: #ffd6e8;
      border-radius: 25px;
      padding: 15px;
      box-shadow: 0 6px 12px #ffb8d6;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0 12px;
      border-radius: 18px;
      border: 2px solid #ffadd2;
      font-family: inherit;
      box-sizing: border-box;
    }

    button {
      background: #ff69b4;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff8ac8;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day {
      background: #fffafd;
      border: 2px solid #ffadd2;
      border-radius: 20px;
      min-height: 105px;
      padding: 8px;
      cursor: pointer;
      overflow: hidden;
    }

    .selected {
      outline: 4px solid #ff69b4;
    }

    .task-mini {
      font-size: 11px;
      padding: 3px 5px;
      border-radius: 10px;
      margin-top: 3px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .timeline-task {
      padding: 12px;
      margin: 10px 0;
      border-radius: 22px;
      box-shadow: 0 3px 8px #ffbad8;
      font-weight: bold;
    }

    .green { background: #8be7b3; }
    .red { background: #ff7b89; }
    .purple { background: #c59bff; }
    .yellow { background: #ffe680; }
    .blue { background: #8ecbff; }

    .small {
      font-size: 12px;
      font-weight: normal;
    }

    .top-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .top-row button {
      width: 60px;
    }

    h2 {
      margin-top: 0;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 1fr;
      }

      .calendar {
        grid-template-columns: repeat(7, minmax(40px, 1fr));
      }

      .day {
        min-height: 90px;
      }

      .box {
        width: 100%;
        box-sizing: border-box;
      }

      body {
        overflow-x: hidden;
      }
    }

  </style>
</head>

<body>
  <header>Planner Website 💖</header>

  <div class="app">
    <div class="box">
      <h2>Add Task</h2>

      <label>Title</label>
      <input id="title" placeholder="Homework, sleep, free time..." />

      <label>Date</label>
      <input id="date" type="date" />

      <label>Start Time</label>
      <input id="start" type="time" value="08:00" />

      <label>Duration Minutes</label>
      <input id="duration" type="number" value="30" />


      <label>Task Type</label>
      <select id="type">
        <option value="green">Green - flexible, can shrink</option>
        <option value="red">Red - non-negotiable length</option>
        <option value="purple">Purple - absolute fixed time</option>
        <option value="blue">Blue - remove transition</option>
      </select>

      <label>
        <input id="droppable" type="checkbox" style="width:auto;" />
        Can be removed if too full
      </label>

      <button onclick="addTask()">Add Task</button>
      <button onclick="exportSaveCode()">Export Save Code</button>
      <button onclick="importSaveCode()">Import Save Code</button>
      <button onclick="enableNotifications()">Enable Notifications</button>
      <button onclick="clearPlanner()">Clear Planner</button>
      

      <h2>Rules</h2>

      <label>Transition Minutes</label>
      <input id="transition" type="number" value="5" />

      <label>Day Starts</label>
      <input id="dayStart" type="time" value="06:00" />

      <label>Day Ends</label>
      <input id="dayEnd" type="time" value="22:00" />

      <p class="small">
        Green = flexible. Red = must stay full length. Purple = fixed time.
        Yellow = automatic transition. Blue = removes transition.
      </p>
    </div>

    <div class="box">
      <div class="top-row">
        <button onclick="changeMonth(-1)">←</button>
        <h2 id="monthTitle"></h2>
        <button onclick="changeMonth(1)">→</button>
      </div>

      <div class="calendar" id="calendar"></div>
    </div>

    <div class="box">
      <h2 id="dayTitle"></h2>
      <div id="timeline"></div>
    </div>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("plannerTasks")) || [];
    let selectedDate = new Date().toISOString().slice(0, 10);
    let currentMonth = new Date().getMonth();
    let currentYear = new Date().getFullYear();

    document.getElementById("date").value = selectedDate;

    function save() {
      localStorage.setItem("plannerTasks", JSON.stringify(tasks));
    }

    function timeToMinutes(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      mins = Math.max(0, Math.min(1440, Math.round(mins)));
      const h = String(Math.floor(mins / 60)).padStart(2, "0");
      const m = String(mins % 60).padStart(2, "0");
      return `${h}:${m}`;
    }

    function addTask() {
        const title = document.getElementById("title").value.trim();
        const dateValue = document.getElementById("date").value;
        const startValue = document.getElementById("start").value;

        if (!title) {
            alert("Please type a task title.");
            return;
        }

        if (!dateValue) {
            alert("Please choose a date.");
            return;
        }

        if (!startValue) {
            alert("Please choose a start time.");
            return;
        }

        const type = document.getElementById("type").value;
        let duration = Number(document.getElementById("duration").value);

        if (type === "blue") duration = 0;

        tasks.push({
            id: crypto.randomUUID(),
            title: title,
            date: dateValue,
            start: timeToMinutes(startValue),
            originalStart: timeToMinutes(startValue),
            duration,
            originalDuration: duration,
            minimum: 0,
            type,
            droppable: document.getElementById("droppable").checked,
            removed: false,
            autoTransition: false,
            createdAt: Date.now()
        });

        selectedDate = dateValue;
        document.getElementById("title").value = "";

        recalculateDay(selectedDate);
        }

    
    function findSlot(task, windows, placed, transition) {
      for (const w of windows) {
        let cursor = Math.max(w.start, task.originalStart);

        while (cursor + task.duration <= w.end) {
          let overlap = placed.find(p =>
            cursor < p.start + p.duration + transition &&
            cursor + task.duration + transition > p.start
          );

          if (!overlap) return cursor;
          cursor = overlap.start + overlap.duration + transition;
        }

        cursor = w.start;

        while (cursor + task.duration <= w.end) {
          let overlap = placed.find(p =>
            cursor < p.start + p.duration + transition &&
            cursor + task.duration + transition > p.start
          );

          if (!overlap) return cursor;
          cursor = overlap.start + overlap.duration + transition;
        }
      }

      return null;
    }

    function redistributeGreens(date, windows, transition) {
      windows.forEach(w => {
        const items = tasks.filter(t =>
          t.date === date &&
          !t.removed &&
          (t.type === "red" || t.type === "green") &&
          t.start >= w.start &&
          t.start < w.end
        );

        const greens = items.filter(t => t.type === "green");
        const reds = items.filter(t => t.type === "red");

        if (greens.length === 0) return;

        const redTime = reds.reduce((sum, t) => sum + t.duration, 0);
        const transitionTime = Math.max(0, items.length - 1) * transition;
        const availableForGreens = Math.max(0, (w.end - w.start) - redTime - transitionTime);
        const originalGreenTotal = greens.reduce((sum, t) => sum + t.originalDuration, 0);

        if (originalGreenTotal > availableForGreens) {
          greens.forEach(g => {
            const share = Math.floor(availableForGreens * (g.originalDuration / originalGreenTotal));
            g.duration = Math.max(g.minimum, share);
          });

          let total = greens.reduce((sum, g) => sum + g.duration, 0);

          if (total > availableForGreens) {
            greens
              .filter(g => g.droppable)
              .forEach(g => {
                if (total > availableForGreens) {
                  g.removed = true;
                  total -= g.duration;
                }
              });
          }

          const remaining = greens.filter(g => !g.removed);

          if (total > availableForGreens && remaining.length > 0) {
            const each = Math.max(5, Math.floor(availableForGreens / remaining.length));
            remaining.forEach(g => g.duration = each);
          }
        }
      });
    }

   
    function createTransitions(date, transition) {
      if (transition <= 0) return;

      const realTasks = tasks
        .filter(t =>
          t.date === date &&
          !t.removed &&
          ["green", "red", "purple"].includes(t.type)
        )
        .sort((a, b) => a.start - b.start);

      const blueMarkers = tasks.filter(t => t.date === date && t.type === "blue");

      for (let i = 0; i < realTasks.length - 1; i++) {
        const current = realTasks[i];
        const next = realTasks[i + 1];

        const gapStart = current.start + current.duration;
        const gapEnd = next.start;

        const hasBlue = blueMarkers.some(b =>
          b.originalStart >= gapStart && b.originalStart <= gapEnd
        );

        if (!hasBlue && gapEnd - gapStart >= transition) {
          tasks.push({
            id: crypto.randomUUID(),
            title: "Transition",
            date,
            start: gapStart,
            originalStart: gapStart,
            duration: transition,
            originalDuration: transition,
            minimum: transition,
            type: "yellow",
            droppable: false,
            removed: false,
            autoTransition: true
          });
        }
      }
    }

    function shrinkGreensEvenly(greens, minutesNeeded) {
      while (minutesNeeded > 0) {
        const activeGreens = greens.filter(g => g.duration > 0);

        if (activeGreens.length === 0) break;

        activeGreens.forEach(g => {
          if (minutesNeeded > 0 && g.duration > 0) {
            g.duration -= 1;
            minutesNeeded -= 1;
          }
        });
      }

      greens.forEach(g => {
        if (g.duration <= 0) {
          g.duration = 0;
          g.removed = true;
        }
      });
    }


  function recalculateDay(date) {
    const transition = Number(document.getElementById("transition").value);
    const dayStart = timeToMinutes(document.getElementById("dayStart").value);
    const dayEnd = timeToMinutes(document.getElementById("dayEnd").value);

    tasks = tasks.filter(t => !(t.date === date && t.autoTransition));

    const dayTasks = tasks.filter(t => t.date === date);

    dayTasks.forEach(t => {
      t.removed = false;
      t.start = t.originalStart;
      t.duration = t.originalDuration;

      if (t.type === "blue") t.duration = 0;
      if (!t.createdAt) t.createdAt = Date.now();
    });

    function sortTasks(a, b) {
      if (a.originalStart !== b.originalStart) {
        return a.originalStart - b.originalStart;
      }
      return (b.createdAt || 0) - (a.createdAt || 0);
    }

    function buildSchedule() {
      const placed = [];

      const purples = dayTasks
        .filter(t => t.type === "purple" && !t.removed)
        .sort(sortTasks);

      purples.forEach(p => {
        p.start = p.originalStart;
        placed.push(p);
      });

  const movable = dayTasks
    .filter(t =>
      (t.type === "red" || t.type === "green") &&
      !t.removed
    )
    .sort(sortTasks);

  movable.forEach(task => {
    let start = Math.max(task.originalStart, dayStart);
    let safety = 0;

    while (safety < 500) {
      safety++;

      const blocker = placed
        .filter(other =>
          start < other.start + other.duration + transition &&
          start + task.duration + transition > other.start
        )
        .sort((a, b) => {
          if (a.start !== b.start) return a.start - b.start;
          return (b.createdAt || 0) - (a.createdAt || 0);
        })[0];

      if (!blocker) break;

      if (task.type === "green") {
        start = blocker.start + blocker.duration + transition;
        continue;
      }

      if (task.type === "red") {
        start = blocker.start + blocker.duration + transition;
        continue;
      }


    }

    

    if (task.duration <= 0 || start + task.duration > dayEnd) {
      task.removed = true;

      if (task.type === "green") {
        task.duration = 0;
      }
    } else {
      task.start = start;

      placed.push(task);

      placed.sort((a, b) => {
        if (a.start !== b.start) return a.start - b.start;
        return (b.createdAt || 0) - (a.createdAt || 0);
      });
    }
  });
}

    buildSchedule();

   
      dayTasks
      .filter(t => t.type === "blue")
      .forEach(b => {
        b.start = b.originalStart;
        b.duration = 0;
      });


    createTransitions(date, transition);
    save();
    render();
  }

    function changeMonth(amount) {
      currentMonth += amount;

      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }

      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }

      render();
    }

    function selectDate(date) {
      selectedDate = date;
      document.getElementById("date").value = date;
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      recalculateDay(selectedDate);
    }

    function makeBlueAfter(task) {
      tasks.push({
        id: crypto.randomUUID(),
        title: "No transition",
        date: task.date,
        start: task.start + task.duration,
        originalStart: task.start + task.duration,
        duration: 0,
        originalDuration: 0,
        minimum: 0,
        type: "blue",
        droppable: false,
        removed: false,
        autoTransition: false
      });

      recalculateDay(task.date);
    }

    function render() {
      renderCalendar();
      renderTimeline();
    }

    function renderCalendar() {
      const calendarDiv = document.getElementById("calendar");
      calendarDiv.innerHTML = "";

      document.getElementById("monthTitle").textContent =
        new Date(currentYear, currentMonth).toLocaleString("default", {
          month: "long",
          year: "numeric"
        });

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        calendarDiv.appendChild(document.createElement("div"));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const date = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        const dayDiv = document.createElement("div");
        dayDiv.className = "day";
        if (date === selectedDate) dayDiv.classList.add("selected");

        dayDiv.onclick = () => selectDate(date);

        dayDiv.innerHTML = `<strong>${d}</strong>`;

        tasks
          .filter(t => t.date === date && !t.removed && !t.autoTransition)
          .sort((a, b) => a.start - b.start)
          .slice(0, 4)
          .forEach(t => {
            const mini = document.createElement("div");
            mini.className = `task-mini ${t.type}`;
            mini.textContent = `${minutesToTime(t.start)} ${t.title}`;
            dayDiv.appendChild(mini);
          });

        calendarDiv.appendChild(dayDiv);
      }
    }

    function renderTimeline() {
      const timeline = document.getElementById("timeline");
      timeline.innerHTML = "";

      document.getElementById("dayTitle").textContent = selectedDate;

      const dayTasks = tasks
        .filter(t => t.date === selectedDate && !t.removed)
        .sort((a, b) => {
          if (a.start !== b.start) return a.start - b.start;

          // same shown time = newest first
          return (b.createdAt || 0) - (a.createdAt || 0);
        });



      dayTasks.forEach(t => {
        const div = document.createElement("div");
        div.className = `timeline-task ${t.type}`;

        div.innerHTML = `
          <div>${t.title}</div>
          <div class="small">
            ${minutesToTime(t.start)} - ${minutesToTime(t.start + t.duration)}
            · ${t.duration} min · ${t.type}
          </div>
          ${!t.autoTransition ? `<button onclick='makeBlueAfter(${JSON.stringify(t)})'>Make next transition blue</button>` : ""}
          <button onclick="deleteTask('${t.id}')">Delete</button>
        `;

        timeline.appendChild(div);
      });

      const removed = tasks
        .filter(t => t.date === selectedDate && t.removed)
        .sort((a, b) => a.originalStart - b.originalStart);

        if (removed.length > 0) {
        const h = document.createElement("h3");
        h.textContent = "Removed / Could Not Fit";
        timeline.appendChild(h);

        removed.forEach(t => {
            const div = document.createElement("div");
            div.className = `timeline-task ${t.type}`;

            div.innerHTML = `
            <div>${t.title}</div>
            <div class="small">
                Wanted: ${minutesToTime(t.originalStart)}
                · ${t.originalDuration} min · ${t.type}
            </div>
            <button onclick="deleteTask('${t.id}')">Delete</button>
            `;

            timeline.appendChild(div);
        });
        }
    }

    function enableNotifications() {
      if (!("Notification" in window)) {
        alert("This browser does not support notifications.");
        return;
      }

      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("Notifications are on. Keep this page open for alerts.");
        }
      });
    }

    setInterval(() => {
      if (!("Notification" in window)) return;
      if (Notification.permission !== "granted") return;

      const now = new Date();
      const today = now.toISOString().slice(0, 10);
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      tasks.forEach(t => {
        if (
          t.date === today &&
          !t.removed &&
          !t.notified &&
          Math.abs(t.start - nowMinutes) <= 1 &&
          t.type !== "yellow" &&
          t.type !== "blue"
        ) {
          new Notification("Planner Website", {
            body: `Time for: ${t.title}`
          });

          t.notified = true;
          save();
        }
      });
    }, 30000);

    render();

    function exportSaveCode() {
        const saveData = {
            tasks,
            selectedDate,
            currentMonth,
            currentYear
        };

        const code = btoa(unescape(encodeURIComponent(JSON.stringify(saveData))));

        navigator.clipboard.writeText(code).then(() => {
            alert("Save code copied!");
        }).catch(() => {
            prompt("Copy this save code:", code);
        });
        }

        function importSaveCode() {
        const code = prompt("Paste your save code:");

        if (!code) return;

        try {
            const saveData = JSON.parse(
            decodeURIComponent(escape(atob(code)))
            );

            tasks = saveData.tasks || [];
            selectedDate = saveData.selectedDate || new Date().toISOString().slice(0, 10);
            currentMonth = saveData.currentMonth ?? new Date().getMonth();
            currentYear = saveData.currentYear ?? new Date().getFullYear();

            save();
            render();

            alert("Planner restored!");
        } catch (e) {
            alert("Invalid save code.");
        }
        }
        function clearPlanner() {
            if (confirm("Clear all saved planner tasks?")) {
                tasks = [];
                localStorage.removeItem("plannerTasks");
                render();
            }
            }
  </script>
</body>
</html>
